# Netlify configuration (used for git-based deploys; the CLI/drag-and-drop
# deploys of the dist folder rely on public/_redirects instead).
[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
